  *{box-sizing:border-box}
  body{margin:0;background:var(--page-bg);color:var(--text);
       font-family:"Microsoft YaHei","PingFang SC",sans-serif;min-height:100vh}
  .wrap{display:flex;gap:24px;justify-content:center;align-items:flex-start;padding:22px;flex-wrap:wrap}
  .boardbox{background:var(--box-bg);border:1px solid var(--box-border);border-radius:18px;
            padding:16px 16px 14px;box-shadow:var(--box-shadow)}
  .title{font-size:15px;color:var(--title);letter-spacing:2px;margin:0 0 12px 4px}
  .title b{color:var(--title-accent);letter-spacing:1px;font-size:17px;text-shadow:var(--title-glow)}
  svg{display:block;border-radius:10px;cursor:pointer;user-select:none;box-shadow:var(--svg-shadow)}
  .panel{width:335px;display:flex;flex-direction:column;gap:13px}
  .card{background:var(--card-bg);border:1px solid var(--card-border);border-radius:13px;
        padding:14px;box-shadow:var(--card-shadow)}
  .card h3{margin:0 0 10px;font-size:13px;color:var(--card-head);font-weight:600;
           letter-spacing:2px;text-shadow:var(--card-head-glow)}
  label{font-size:13px;color:var(--label)}
  select,input{background:var(--input-bg);color:var(--input-color);border:1px solid var(--input-border);
               border-radius:8px;padding:6px 9px;font-size:13px;transition:border-color .15s, box-shadow .15s}
  select:focus,input:focus{outline:none;border-color:var(--input-focus);box-shadow:var(--input-focus-shadow)}
  .row{display:flex;align-items:center;gap:8px;margin:8px 0}
  button{background:var(--btn-bg);color:var(--btn-color);border:1px solid var(--btn-border);
         border-radius:10px;padding:8px 13px;font-size:13px;cursor:pointer;transition:.18s;
         box-shadow:0 3px 8px rgba(0,0,0,.3)}
  button:hover{border-color:var(--btn-hover-border);color:#fff;transform:translateY(-1px);
               box-shadow:var(--btn-hover-shadow)}
  button:active{transform:translateY(0)}
  button.primary{background:var(--primary-bg);border-color:var(--primary-border);
                 font-weight:600;text-shadow:var(--primary-glow);box-shadow:var(--primary-shadow)}
  button.primary:hover{background:var(--primary-bg-hover)}
  button:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
  .status{font-size:14px;min-height:22px;color:var(--status)}
  .status .em{color:var(--em);font-weight:600;text-shadow:var(--em-glow)}
  .moves{height:120px;overflow-y:auto;font-size:12.5px;line-height:1.85;color:var(--moves-color);
         font-family:Consolas,monospace;background:var(--moves-bg);border:1px solid var(--moves-border);
         border-radius:8px;padding:8px}
  .moves::-webkit-scrollbar{width:8px}
  .moves::-webkit-scrollbar-track{background:transparent}
  .moves::-webkit-scrollbar-thumb{background:var(--moves-thumb);border-radius:4px}
  .moves b{color:var(--moves-strong);font-family:"Microsoft YaHei",sans-serif;text-shadow:var(--moves-strong-glow)}
  .score{font-size:17px;font-weight:700;color:var(--score);text-shadow:var(--score-glow);line-height:1.4}
  .evalbar{position:relative;height:14px;border-radius:7px;overflow:hidden;
           border:1px solid var(--card-border);background:#39424f;margin-bottom:8px}
  #evalfill{position:absolute;left:0;top:0;bottom:0;width:50%;transition:width .45s ease;
            background:linear-gradient(90deg,#e05a4a,#c0392b)}
  .evalmid{position:absolute;left:50%;top:0;bottom:0;width:2px;margin-left:-1px;
           background:rgba(255,255,255,.6)}
  .evalrow{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 2px}
  .small{font-size:11.5px;color:var(--small);line-height:1.7;word-break:break-all}
  .pvs{font-family:Consolas,monospace;font-size:11.5px;color:var(--pvs);line-height:1.8;word-break:break-all}
  .cand{cursor:pointer;padding:1px 5px;margin:0 -5px;border-radius:6px;transition:background .15s}
  .cand:hover{background:rgba(255,255,255,.09)}
  .cand.picked{color:#7ee7a2}
  .tip{font-size:11.5px;color:var(--tip);line-height:1.75}
  .lastmove-pulse{transform-box:fill-box;transform-origin:center;animation:pulse 900ms ease-out 2}
  @keyframes pulse{
    0%{transform:scale(.85);opacity:.9}
    70%{transform:scale(1.35);opacity:.35}
    100%{transform:scale(1.55);opacity:0}
  }
  .movebadge{font-family:"Microsoft YaHei",sans-serif}
  .turnhint{font-size:11.5px;color:var(--small);margin-top:-2px}
  .sw{display:flex;align-items:center;gap:5px;font-size:12.5px;color:var(--label);cursor:pointer;user-select:none}
  .sw input{accent-color:var(--accent)}
  /* ---- A1 落子滑行动画 + 吃子碎裂特效 ---- */
  .pc.slide{transition:transform .26s cubic-bezier(.25,.9,.3,1)}
  .shard{animation:shatter .6s ease-out forwards}
  @keyframes shatter{to{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.15)}}
  .capghost{transform-box:fill-box;transform-origin:center;animation:capfade .5s ease-out forwards}
  @keyframes capfade{to{opacity:0;transform:scale(1.8)}}
  /* ---- A5 落点涟漪冲击波（双方落子通用） ---- */
  .ripple{transform-box:fill-box;transform-origin:center;animation:ripplefx .55s ease-out forwards}
  .ripple.r2{animation-delay:.13s;animation-duration:.65s}
  @keyframes ripplefx{0%{transform:scale(.45);opacity:.95}100%{transform:scale(2.35);opacity:0}}
  /* ---- A6 被将军方老将红圈脉冲 ---- */
  .chkpulse{transform-box:fill-box;transform-origin:center;
    animation:chkping 1s ease-out infinite;filter:drop-shadow(0 0 6px rgba(255,45,85,.9))}
  @keyframes chkping{0%{transform:scale(.92);opacity:1}70%{transform:scale(1.26);opacity:.3}
    100%{transform:scale(1.42);opacity:0}}
  /* ---- A2 将军/绝杀全屏横幅 ---- */
  #fxbanner{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    pointer-events:none;z-index:999;opacity:0}
  #fxbanner.show{animation:bannerfx 1.5s ease-out forwards}
  #fxbanner span{font-size:120px;font-weight:800;font-family:"Microsoft YaHei",serif;
    letter-spacing:14px;-webkit-text-stroke:2px rgba(255,255,255,.8)}
  #fxbanner.check span{color:#ff4d5e;text-shadow:0 0 24px #ff4d5e,0 0 70px #ff2038}
  #fxbanner.mate span{color:#ffd24d;text-shadow:0 0 24px #ffb02e,0 0 80px #ff8c00}
  @keyframes bannerfx{0%{opacity:0;transform:scale(2.4)}14%{opacity:1;transform:scale(1)}
    72%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.9)}}
  /* ---- A3 战损陈列区 ---- */
  .captured{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:6px;
    min-height:26px;font-family:"KaiTi","Microsoft YaHei",serif;font-size:17px;line-height:24px}
  .captured .grp{display:flex;align-items:baseline;gap:3px;flex-wrap:wrap;min-width:0}
  .captured .lbl{font-size:11px;color:var(--small);font-family:"Microsoft YaHei",sans-serif;margin-right:2px}
  .captured b{font-weight:700}
  .capR{color:#e05a4a}.capB{color:#8fa3b8}
  /* ---- A4 主题背景微动效（赛博霓虹 / 暗夜紫罗） ---- */
  body[data-theme="cyber"]::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:radial-gradient(55% 45% at 18% 12%,rgba(0,229,255,.08),transparent 62%),
               radial-gradient(48% 42% at 84% 86%,rgba(255,45,85,.07),transparent 60%),
               repeating-linear-gradient(0deg,rgba(0,229,255,.025) 0 1px,transparent 1px 46px),
               repeating-linear-gradient(90deg,rgba(0,229,255,.025) 0 1px,transparent 1px 46px);
    animation:bgflow 16s ease-in-out infinite alternate}
  body[data-theme="nocturne"]::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:radial-gradient(55% 45% at 18% 12%,rgba(167,139,250,.08),transparent 62%),
               radial-gradient(48% 42% at 84% 86%,rgba(244,114,182,.07),transparent 60%),
               repeating-linear-gradient(0deg,rgba(167,139,250,.025) 0 1px,transparent 1px 46px),
               repeating-linear-gradient(90deg,rgba(167,139,250,.025) 0 1px,transparent 1px 46px);
    animation:bgflow 16s ease-in-out infinite alternate}
  @keyframes bgflow{from{transform:translate(0,0) scale(1)}to{transform:translate(-2.5%,2%) scale(1.05)}}
</style>
</head>
<body>
<div id="fxbanner"></div>
<div class="wrap">
  <div class="boardbox">
    <p class="title"><b>中国象棋</b> · Pikafish 2026-09-06 · 本地离线</p>
    <svg id="board" width="560" height="620" viewBox="0 0 560 620"></svg>
    <div class="captured">
      <span class="grp"><span class="lbl">AI 战果</span><span id="capAI"><span class="lbl">—</span></span></span>
      <span class="grp"><span class="lbl">你的战果</span><span id="capHuman"><span class="lbl">—</span></span></span>
    </div>
  </div>

  <div class="panel">

        <select id="level">
          <option value="1">入门</option>
          <option value="2">初级</option>

      </div>
      <div class="row">
        <label>开局套路</label>

          <option value="none">不限定（引擎最强）</option>

        </select>
      </div>
      <div class="tip" style="margin:-4px 0 8px">AI 前 6 回合只在所选套路的着法里挑当前局面最优的一手，会随你的应手变化。</div>
      <div class="row">
        <label>界面主题</label>
        <select id="theme" style="flex:1">
          <option value="cyber">赛博霓虹</option>

          <option value="porcelain">青花瓷韵</option>

        <button id="undo">悔棋</button>

      </div>
      <div class="row">
        <label class="sw"><input type="checkbox" id="sound" checked> 落子音效</label>
      </div>

    </div>

    <div class="card">
      <h3>局势评估</h3>
      <div class="small" style="display:flex;justify-content:space-between">
        <span style="color:#e05a4a">■ 我方（AI 方）</span><span style="color:#9aa7b8">对方 ■</span>
      </div>
      <div class="evalbar"><div id="evalfill"></div><div class="evalmid"></div></div>

        <span class="score" id="score">—</span>

    <div class="card">
      <h3>说明</h3>
      <div class="tip">点自己的棋子选中（显示可走点），再点目标格落子。<br>
      AI 越下越强：中局自动加时 1.3 倍、残局缠斗 1.6 倍；连续将军时会主动变招换思路，绝不长将违规。<br>
      本页面与本机引擎通信，全程不联网。</div>
    </div>
  </div>
</div>

<script>
/* ================= 基础常量 ================= */
const FILES = "abcdefghi";
const COLS = 9, ROWS = 10, M = 40, CELL = 60, R = 26;
const RED = "r", BLK = "b";
const START_FEN = "rnbakabnr/9/1c5c1/p1p1p1p1p/9/9/P1P1P1P1P/1C5C1/9/RNBAKABNR w - - 0 1";
const CHAR = { K:"帥", A:"仕", B:"相", N:"傌", R:"俥", C:"炮", P:"兵",
               k:"將", a:"士", b:"象", n:"馬", r:"車", c:"砲", p:"卒" };
const NAME = { K:"帅", A:"仕", B:"相", N:"马", R:"车", C:"炮", P:"兵",
               k:"将", a:"士", b:"象", n:"马", r:"车", c:"炮", p:"卒" };
const CN_NUM = ["零","一","二","三","四","五","六","七","八","九"];

/* ================= 音效（Web Audio 合成，无需音频文件，完全离线） ================= */
let actx = null;
function soundOn() {
  const c = document.getElementById("sound");
  return !c || c.checked;
}
function audio() {
  if (!soundOn()) return null;
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume();
    return actx;
  } catch (e) { return null; }
}
function beep(freq, dur, type, vol, delay) {
  const a = audio();
  if (!a) return;
  const t = a.currentTime + (delay || 0);
  const o = a.createOscillator();
  const g = a.createGain();
  o.type = type || "triangle";
  o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol || 0.2, t + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(a.destination);
  o.start(t); o.stop(t + dur + 0.03);
}
function playMoveSound(isAI, capture) {
  if (isAI) { beep(330, 0.10, "triangle", 0.3); beep(210, 0.13, "sine", 0.24, 0.02); }
  else { beep(760, 0.055, "square", 0.15); beep(540, 0.07, "triangle", 0.18, 0.02); }
  if (capture) beep(150, 0.16, "sawtooth", 0.2, 0.05);
}
function playCheckSound() { beep(1180, 0.08, "sine", 0.22); beep(990, 0.1, "sine", 0.2, 0.12); }

const idx = (c, r) => r * 9 + c;
const inB = (c, r) => c >= 0 && c < 9 && r >= 0 && r < 10;
const isRed = t => t === t.toUpperCase();
const sideOf = t => isRed(t) ? RED : BLK;
const other = s => s === RED ? BLK : RED;
const colOf = i => i % 9, rowOf = i => Math.floor(i / 9);

/* ================= 开局套路（着法集合，见招拆招） =================
   每个套路给出一批"合套路"的着法，AI 每步只在这批里挑当前局面的最优手，
   所以对手怎么应，它就在套路内相应调整，而不是照单走死板序列。 */
const BOOK = {
  zhongpao: { name:"中炮直车",
    keyRed:["h2e2"], keyBlack:["h9g7","b9c7"],
    red:  ["h2e2","h0g2","b0c2","i0h0","a0b0"],
    black:["h7e7","b7e7","h9g7","b9c7","i9h9","a9b9"] },
  leigong: { name:"雷公炮",
    keyRed:["h2e2"], keyBlack:["h7e7"],
    red:  ["h2e2","b2b4","b4e4","b0c2","h0g2"],
    black:["h7e7","b7b5","b5e5","b9c7","h9g7"] },
  xianren: { name:"仙人指路",
    keyRed:["c3c4","g3g4"], keyBlack:["g6g5","c6c5"],
    red:  ["c3c4","g3g4","b0c2","h0g2","a0b0","i0h0"],
    black:["g6g5","c6c5","b9c7","h9g7","a9b9","i9h9"] },
  feixiang: { name:"飞相局",
    keyRed:["g0e2","c0e2"], keyBlack:["g9e7","c9e7"],
    red:  ["g0e2","c0e2","b0c2","h0g2","i0h0","a0b0","g3g4","c3c4"],
    black:["g9e7","c9e7","b9c7","h9g7","i9h9","a9b9","g6g5","c6c5"] },
  guogong: { name:"过宫炮",
    keyRed:["h2d2","b2f2"], keyBlack:["h7d7","b7f7"],
    red:  ["h2d2","b2f2","h0g2","b0c2","a0b0","i0h0"],
    black:["h7d7","b7f7","h9g7","b9c7","a9b9","i9h9"] },
  pingfeng: { name:"屏风马",
    keyRed:["b0c2","h0g2"], keyBlack:["h9g7","b9c7"],
    red:  ["b0c2","h0g2","a0b0","i0h0","c3c4","g3g4"],
    black:["h9g7","b9c7","i9h9","a9b9","g6g5","c6c5"] },
  shunpao: { name:"顺炮",
    keyRed:["h2e2"], keyBlack:["h7e7"],
    red:  ["h2e2","h0g2","b0c2","i0h0"],
    black:["h7e7","h9g7","b9c7","i9h9"] },
  liepao: { name:"列炮",
    keyRed:["b2e2"], keyBlack:["b7e7"],
    red:  ["b2e2","b0c2","h0g2","a0b0","i0h0"],
    black:["b7e7","b9c7","h9g7","a9b9","i9h9"] },
  bagua: { name:"八卦防守（士相全）",
    keyRed:["d0e1","f0e1"], keyBlack:["d9e8","f9e8"],
    red:  ["d0e1","f0e1","g0e2","c0e2","b0c2","h0g2","a0b0","i0h0"],
    black:["d9e8","f9e8","g9e7","c9e7","b9c7","h9g7","a9b9","i9h9"] }
};
const BOOK_PLIES = 12;   // 前 6 回合（双方各 6 步）内按套路

function themeSignature() {
  const key = document.getElementById("book").value;
  if (key === "none") return null;
  const entry = BOOK[key];
  if (!entry) return null;
  if (moveList.some(m => m.byAI)) return null;   // 只锁全局第一手
  const aiSide = other(humanSide);
  const sig = aiSide === RED ? entry.keyRed : entry.keyBlack;
  if (!sig || !sig.length) return null;
  for (const uci of sig) {
    const from = idx(FILES.indexOf(uci[0]), +uci[1]);
    const to = idx(FILES.indexOf(uci[2]), +uci[3]);
    const p = board[from];
    if (!p || sideOf(p) !== aiSide) continue;
    if (!legalMovesFrom(board, from, aiSide).some(m => m.to === to)) continue;
    return { from, to, name: entry.name };
  }
  return null;
}

function themeCandidates() {
  const key = document.getElementById("book").value;
  if (key === "none") return null;
  if (moveList.length >= BOOK_PLIES) return null;
  const entry = BOOK[key];
  if (!entry) return null;
  const aiSide = other(humanSide);
  const aiMoved = moveList.some(m => m.byAI);
  // AI 全局第一手锁定招牌着法，保证"像这个开局"，而不是一上来就挑分最高的散手
  let vocab = aiSide === RED ? entry.red : entry.black;
  if (!aiMoved) {
    const sig = aiSide === RED ? entry.keyRed : entry.keyBlack;
    if (sig && sig.length) vocab = sig.concat(vocab.filter(u => !sig.includes(u)));
  }
  if (!vocab) return null;
  const allow = [];
  for (const uci of vocab) {
    if (!FILES.includes(uci[0])) continue;
    const from = idx(FILES.indexOf(uci[0]), +uci[1]);
    const to = idx(FILES.indexOf(uci[2]), +uci[3]);
    const p = board[from];
    if (!p || sideOf(p) !== aiSide) continue;
    if (!legalMovesFrom(board, from, aiSide).some(m => m.to === to)) continue;
    allow.push(uci);
  }
  if (!allow.length) return null;
  const sigAllow = !aiMoved && allow.filter(u => (aiSide === RED ? entry.keyRed : entry.keyBlack).includes(u));
  return { allow: (sigAllow && sigAllow.length ? sigAllow : allow).slice(0, 10), name: entry.name };
}

/* ================= 棋盘状态 ================= */
let board = [];
let turn = RED;
let humanSide = RED;
let flipped = false;   // 执黑时棋盘翻转 180°：黑方在下半盘
let moveList = [];      // {from,to,uci,cn,piece}
let lastAI = null;      // AI 最近一次决策 {ply, played, cands, book}——候选着法可点击改走
let pendingAnim = null; // 待播放的落子动画 {from,to,capP}，双方落子都会设置，由 drawPieces 消费
let selected = -1;
let legal = [];         // 当前选中棋子的合法目标
let thinking = false;
let gameOver = false;

function parseFEN(fen) {
  const b = new Array(90).fill(null);
  const rows = fen.split(" ")[0].split("/");
  for (let i = 0; i < 10; i++) {
    let c = 0;
    for (const ch of rows[i]) {
      if (/\d/.test(ch)) c += +ch;
      else { b[idx(c, 9 - i)] = ch; c++; }
    }
  }
  return b;
}
function resetBoard() {
  board = parseFEN(START_FEN);
  turn = RED;
  moveList = []; selected = -1; legal = []; gameOver = false;
  posHistory = {};
  posHistory[posKey(board, turn)] = 1;
}

/* ================= 重复局面 / 长打禁着 ================= */
let posHistory = {};

function posKey(b, side) {
  return b.map(p => p || ".").join("") + side;
}

function recordPosition() {
  const k = posKey(board, turn);
  posHistory[k] = (posHistory[k] || 0) + 1;
  return posHistory[k];
}

/* 某方最近连续"自己每步都将军"的回合数（从最新一手往回数） */
function checkStreakOf(side) {
  let n = 0;
  for (let i = moveList.length - 1; i >= 0; i--) {
    const mvSide = (i % 2 === 0) ? RED : BLK;
    if (mvSide !== side) continue;
    if (moveList[i].gaveCheck) n++;
    else break;
  }
  return n;
}

/* AI 走 from->to 是否会构成长将违规（走完局面第3次出现且AI正在连续将军） */
function wouldBeLongCheck(from, to) {
  const aiSide = other(humanSide);
  const b2 = applyMove(board, from, to);
  if (!kingAttacked(b2, humanSide)) return false;      // 这步不是将军，无妨
  const k = posKey(b2, humanSide);                     // 走完后轮到人类
  if ((posHistory[k] || 0) < 2) return false;          // 走完才第3次才算重复循环
  return checkStreakOf(aiSide) >= 2;                   // AI 前两个自己回合都在将
}

/* ================= 走法生成 ================= */
function pseudoMoves(b, side) {
  const out = [];
  const add = (f, t) => out.push({ from: f, to: t });
  for (let i = 0; i < 90; i++) {
    const p = b[i];
    if (!p || sideOf(p) !== side) continue;
    const c = colOf(i), r = rowOf(i), t = p.toUpperCase();
    if (t === "R" || t === "C") {
      for (const [dc, dr] of [[1,0],[-1,0],[0,1],[0,-1]]) {
        let cc = c + dc, rr = r + dr, jumped = false;
        while (inB(cc, rr)) {
          const q = b[idx(cc, rr)];
          if (t === "R") {
            if (!q) add(i, idx(cc, rr));
            else { if (sideOf(q) !== side) add(i, idx(cc, rr)); break; }
          } else {
            if (!jumped) {
              if (!q) add(i, idx(cc, rr));
              else jumped = true;
            } else if (q) {
              if (sideOf(q) !== side) add(i, idx(cc, rr));
              break;
            }
          }
          cc += dc; rr += dr;
        }
      }
    } else if (t === "N") {
      for (const [dc, dr] of [[1,2],[2,1],[2,-1],[1,-2],[-1,-2],[-2,-1],[-2,1],[-1,2]]) {
        const nc = c + dc, nr = r + dr;
        if (!inB(nc, nr)) continue;
        const leg = Math.abs(dc) === 2 ? idx(c + dc / 2, r) : idx(c, r + dr / 2);
        if (b[leg]) continue;
        if (!b[idx(nc, nr)] || sideOf(b[idx(nc, nr)]) !== side) add(i, idx(nc, nr));
      }
    } else if (t === "B") {
      for (const [dc, dr] of [[2,2],[2,-2],[-2,2],[-2,-2]]) {
        const nc = c + dc, nr = r + dr;
        if (!inB(nc, nr)) continue;
        if (b[idx(c + dc / 2, r + dr / 2)]) continue;
        if (side === RED && nr > 4) continue;
        if (side === BLK && nr < 5) continue;
        if (!b[idx(nc, nr)] || sideOf(b[idx(nc, nr)]) !== side) add(i, idx(nc, nr));
      }
    } else if (t === "A") {
      for (const [dc, dr] of [[1,1],[1,-1],[-1,1],[-1,-1]]) {
        const nc = c + dc, nr = r + dr;
        if (nc < 3 || nc > 5) continue;
        if (side === RED && (nr < 0 || nr > 2)) continue;
        if (side === BLK && (nr < 7 || nr > 9)) continue;
        if (!b[idx(nc, nr)] || sideOf(b[idx(nc, nr)]) !== side) add(i, idx(nc, nr));
      }
    } else if (t === "K") {
      for (const [dc, dr] of [[1,0],[-1,0],[0,1],[0,-1]]) {
        const nc = c + dc, nr = r + dr;
        if (nc < 3 || nc > 5) continue;
        if (side === RED && (nr < 0 || nr > 2)) continue;
        if (side === BLK && (nr < 7 || nr > 9)) continue;
        if (!b[idx(nc, nr)] || sideOf(b[idx(nc, nr)]) !== side) add(i, idx(nc, nr));
      }
      // 白脸将（飞将）
      const dir = side === RED ? 1 : -1;
      let rr = r + dir;
      while (inB(c, rr)) {
        const q = b[idx(c, rr)];
        if (q) { if (q.toUpperCase() === "K" && sideOf(q) !== side) add(i, idx(c, rr)); break; }
        rr += dir;
      }
    } else if (t === "P") {
      const dir = side === RED ? 1 : -1;
      const nr = r + dir;
      if (inB(c, nr) && (!b[idx(c, nr)] || sideOf(b[idx(c, nr)]) !== side)) add(i, idx(c, nr));
      const crossed = side === RED ? r >= 5 : r <= 4;
      if (crossed) {
        for (const dc of [-1, 1]) {
          const nc = c + dc;
          if (inB(nc, r) && (!b[idx(nc, r)] || sideOf(b[idx(nc, r)]) !== side)) add(i, idx(nc, r));
        }
      }
    }
  }
  return out;
}

function findKing(b, side) {
  const k = side === RED ? "K" : "k";
  for (let i = 0; i < 90; i++) if (b[i] === k) return i;
  return -1;
}

function kingAttacked(b, side) {
  const k = findKing(b, side);
  if (k < 0) return true;
  const enemy = other(side);
  for (const m of pseudoMoves(b, enemy)) if (m.to === k) return true;
  return false;
}

function applyMove(b, from, to) {
  const nb = b.slice();
  nb[to] = nb[from];
  nb[from] = null;
  return nb;
}

function legalMovesFrom(b, from, side) {
  return pseudoMoves(b, side).filter(m => m.from === from &&
    !kingAttacked(applyMove(b, m.from, m.to), side));
}

function allLegalMoves(b, side) {
  return pseudoMoves(b, side).filter(m => !kingAttacked(applyMove(b, m.from, m.to), side));
}

/* ================= 记谱 ================= */
function fileNum(c, side) { return side === RED ? 9 - c : c + 1; }
function numStr(n, side) {
  return side === RED ? CN_NUM[n] : String(n);
}
function moveToCN(b, from, to) {
  const p = b[from];
  if (!p) return "";
  const side = sideOf(p);
  const t = p.toUpperCase();
  const c1 = colOf(from), r1 = rowOf(from), c2 = colOf(to), r2 = rowOf(to);
  let prefix = "";
  // 同列同种棋子：用前/后
  let same = [];
  for (let r = 0; r < 10; r++) {
    const q = b[idx(c1, r)];
    if (q && q === p) same.push(r);
  }
  if (same.length >= 2 && (t === "R" || t === "C" || t === "N" || t === "P" || t === "A" || t === "B")) {
    const front = side === RED ? Math.max(...same) : Math.min(...same);
    prefix = r1 === front ? "前" : "后";
  }
  const head = prefix
    ? prefix + NAME[p]
    : NAME[p] + numStr(fileNum(c1, side), side);
  const forward = side === RED ? r2 > r1 : r2 < r1;
  const backward = side === RED ? r2 < r1 : r2 > r1;
  let body, tail;
  if (r2 === r1) {
    body = "平";
    tail = numStr(fileNum(c2, side), side);
  } else if (forward) {
    body = "进";
    tail = (t === "R" || t === "C" || t === "P" || t === "K")
      ? numStr(Math.abs(r2 - r1), side)
      : numStr(fileNum(c2, side), side);
  } else if (backward) {
    body = "退";
    tail = (t === "R" || t === "C" || t === "P" || t === "K")
      ? numStr(Math.abs(r2 - r1), side)
      : numStr(fileNum(c2, side), side);
  } else body = "平", tail = numStr(fileNum(c2, side), side);
  return head + body + tail;
}

function el(name, attrs) {
  const e = document.createElementNS(NS, name);
  for (const k in attrs) e.setAttribute(k, attrs[k]);

}

function mkGrad(id, stops, linear) {
  const g = el(linear ? "linearGradient" : "radialGradient",
               linear ? { id, x1:"0", y1:"0", x2:"1", y2:"1" }
                      : { id, cx:"35%", cy:"28%", r:"82%" });
  for (const [off, col] of stops) {
    const s = document.createElementNS(NS, "stop");
    s.setAttribute("offset", off); s.setAttribute("stop-color", col);
    g.appendChild(s);
  }
  return g;
}

function drawBoardBase() {
  svg.innerHTML = "";
  const defs = el("defs", {});
  defs.appendChild(mkGrad("wood", TH.wood, true));
  defs.appendChild(mkGrad("pgr", TH.pgr, false));
  defs.appendChild(mkGrad("pgb", TH.pgb, false));
  svg.appendChild(defs);
  svg.appendChild(el("rect", { x:0, y:0, width:560, height:620, fill:"url(#wood)", rx:8 }));
  svg.appendChild(el("rect", { x:6, y:6, width:548, height:608, fill:"none",
                               stroke:TH.inner, "stroke-width":1, rx:5 }));
  const g = el("g", { stroke:TH.grid, "stroke-width":1.6, fill:"none" });
  for (let r = 0; r < 10; r++)
    g.appendChild(el("line", { x1:px(0), y1:py(r), x2:px(8), y2:py(r) }));
  for (let c = 0; c < 9; c++) {
    if (c === 0 || c === 8)
      g.appendChild(el("line", { x1:px(c), y1:py(0), x2:px(c), y2:py(9) }));
    else {
      g.appendChild(el("line", { x1:px(c), y1:py(0), x2:px(c), y2:py(4) }));
      g.appendChild(el("line", { x1:px(c), y1:py(5), x2:px(c), y2:py(9) }));
    }
  }
  // 九宫斜线
  g.appendChild(el("line", { x1:px(3), y1:py(0), x2:px(5), y2:py(2) }));
  g.appendChild(el("line", { x1:px(5), y1:py(0), x2:px(3), y2:py(2) }));

}

function drawLastMove() {
  if (!moveList.length) return;
  const m = moveList[moveList.length - 1];
  const g = el("g", { class:"mvfx" });
  const x1 = px(colOf(m.from)), y1 = py(rowOf(m.from));
  const x2 = px(colOf(m.to)), y2 = py(rowOf(m.to));
  // 起止高亮
  for (const [x, y] of [[x1, y1], [x2, y2]]) {
    g.appendChild(el("circle", { cx:x, cy:y, r:29,
      fill:TH.lastFill, stroke:TH.lastStroke, "stroke-width":1.3 }));
  }
  // 终点脉冲
  g.appendChild(el("circle", { class:"lastmove-pulse", cx:x2, cy:y2, r:R+3,
    fill:"none", stroke:m.byAI ? TH.ai : TH.human, "stroke-width":4 }));
  // 走子路径箭头
  const ang = Math.atan2(y2 - y1, x2 - x1);
  const sx = x1 + Math.cos(ang) * (R + 3), sy = y1 + Math.sin(ang) * (R + 3);
  const tx = x2 - Math.cos(ang) * (R + 7), ty = y2 - Math.sin(ang) * (R + 7);
  const color = m.byAI ? TH.ai : TH.human;
  g.appendChild(el("line", { x1:sx, y1:sy, x2:tx, y2:ty, stroke:color,
    "stroke-width":5, "stroke-linecap":"round", opacity:.92 }));
  const hl = 15, hw = 10.5;
  const hx = tx + Math.cos(ang) * hl, hy = ty + Math.sin(ang) * hl;
  const p1x = tx + Math.cos(ang + Math.PI/2) * hw, p1y = ty + Math.sin(ang + Math.PI/2) * hw;
  const p2x = tx + Math.cos(ang - Math.PI/2) * hw, p2y = ty + Math.sin(ang - Math.PI/2) * hw;
  g.appendChild(el("polygon", { points:`${hx},${hy} ${p1x},${p1y} ${p2x},${p2y}`,
    fill:color, opacity:.92 }));
  // 着法文字标签
  const label = m.cn;
  const bw = Math.max(46, label.length * 15 + 14), bh = 22;
  let bx = x2 - bw / 2, by = y2 + R + 6;
  if (by + bh > 616) by = y2 - R - 6 - bh;
  if (bx < 6) bx = 6;
  if (bx + bw > 554) bx = 554 - bw;
  g.appendChild(el("rect", { x:bx, y:by, width:bw, height:bh, rx:6,
    fill: m.byAI ? TH.aiBadge : TH.humanBadge,
    stroke:color, "stroke-width":1 }));
  const t = el("text", { class:"movebadge", x:bx + bw/2, y:by + bh/2 + 5,
    "text-anchor":"middle", "font-size":13.5, fill:color, "font-weight":600,
    style: TH.badgeGlow ? "text-shadow:0 0 6px currentColor" : "" });
  t.textContent = label;
  g.appendChild(t);
  svg.appendChild(g);
}

function drawPieces() {
  [...svg.querySelectorAll(".pc,.hint,.sel,.mvfx,.chkpulse")].forEach(n => n.remove());
  drawLastMove();
  for (let i = 0; i < 90; i++) {
    const p = board[i];
    if (!p) continue;
    const c = colOf(i), r = rowOf(i), red = isRed(p);
    const g = el("g", { class:"pc", "data-i": i });
    // 底部投影
    g.appendChild(el("ellipse", { cx:px(c)+2.5, cy:py(r)+4.5, rx:R*0.94, ry:R*0.82,
      fill:TH.shadow }));
    // 棋子主体
    g.appendChild(el("circle", { cx:px(c), cy:py(r), r:R,
      fill:red ? "url(#pgr)" : "url(#pgb)",
      stroke:red ? TH.redStroke : TH.blkStroke, "stroke-width":2.6 }));
    g.appendChild(el("circle", { cx:px(c), cy:py(r), r:R-5,
      fill:"none", stroke:red ? TH.redInner : TH.blkInner,
      "stroke-width":1.3 }));
    const t = el("text", { x:px(c), y:py(r)+9, "text-anchor":"middle", "font-size":28,
      "font-family":'"KaiTi","Microsoft YaHei",serif',
      "font-weight":700, fill:red ? TH.redText : TH.blkText,
      stroke:TH.textStroke, "stroke-width":0.8, "paint-order":"stroke",
      style: red ? TH.redGlow : TH.blkGlow });
    t.textContent = CHAR[p];
    g.appendChild(t);
    svg.appendChild(g);
  }
  if (selected >= 0) {
    svg.appendChild(el("circle", { class:"sel", cx:px(colOf(selected)), cy:py(rowOf(selected)),
      r:R+5, fill:"none", stroke:TH.sel, "stroke-width":3 }));
  }
  for (const m of legal) {
    const occupied = board[m.to];
    svg.appendChild(el("circle", { class:"hint", cx:px(colOf(m.to)), cy:py(rowOf(m.to)),
      r: occupied ? R+4 : 9, fill: occupied ? TH.hintOcc : TH.hintDot,
      stroke: occupied ? TH.hintOccStroke : "none", "stroke-width": occupied ? 2 : 0 }));
  }
  // 被将军一方老将的红圈脉冲（持续到应将为止）
  if (kingAttacked(board, turn)) {
    const kp = board.findIndex(p => p === (turn === RED ? "K" : "k"));
    if (kp >= 0)
      svg.appendChild(el("circle", { class:"chkpulse", cx:px(colOf(kp)), cy:py(rowOf(kp)),
        r:R+7, fill:"none", stroke:"#ff2d55", "stroke-width":3.5 }));
  }
  if (pendingAnim) {
    const a = pendingAnim; pendingAnim = null;
    playSlideFx(a);
  }
}

/* ---- A1：落子滑行动画 + 吃子碎裂特效（双方落子通用） ---- */
function playSlideFx(a) {
  const t = svg.querySelector(`.pc[data-i="${a.to}"]`);
  if (!t) return;
  const dx = px(colOf(a.from)) - px(colOf(a.to));
  const dy = py(rowOf(a.from)) - py(rowOf(a.to));
  if (a.capP) shatterFx(a.to, a.capP);
  const landRed = isRed(board[a.to]);
  setTimeout(() => rippleFx(a.to, landRed), 210);   // 等滑行到位再激起涟漪
  svg.appendChild(t);            // 滑动中的棋子置于最上层
  t.classList.add("slide");
  t.style.transform = `translate(${dx}px, ${dy}px)`;
  requestAnimationFrame(() => requestAnimationFrame(() => {
    t.style.transform = "";
    setTimeout(() => t.classList.remove("slide"), 300);
  }));
}

/* ---- A5：落点涟漪冲击波（双环扩散，按落子方配色） ---- */
function rippleFx(i, red) {
  const c = colOf(i), r = rowOf(i);
  const g = el("g", { class:"mvfx" });
  g.appendChild(el("circle", { class:"ripple", cx:px(c), cy:py(r), r:R+3,
    fill:"none", stroke: red ? TH.redStroke : TH.blkStroke, "stroke-width":3.5 }));
  g.appendChild(el("circle", { class:"ripple r2", cx:px(c), cy:py(r), r:R+3,
    fill:"none", stroke: red ? TH.redText : TH.blkText, "stroke-width":2 }));
  svg.appendChild(g);
  setTimeout(() => g.remove(), 850);
}

function shatterFx(i, victimP) {
  const c = colOf(i), r = rowOf(i), red = isRed(victimP);
  const g = el("g", { class:"mvfx" });
  const ghost = el("text", { x:px(c), y:py(r)+9, "text-anchor":"middle", "font-size":28,
    "font-family":'"KaiTi","Microsoft YaHei",serif', "font-weight":700,
    fill:red ? TH.redText : TH.blkText, class:"capghost" });
  ghost.textContent = CHAR[victimP];
  g.appendChild(ghost);
  for (let k = 0; k < 7; k++) {
    const ang = Math.PI * 2 * k / 7 + Math.random() * .6, d = 26 + Math.random() * 22;
    const s = el("circle", { cx:px(c), cy:py(r), r: 2.2 + Math.random() * 2.4,
      fill:red ? TH.redText : TH.blkText, class:"shard" });
    s.style.setProperty("--dx", (Math.cos(ang) * d).toFixed(1) + "px");
    s.style.setProperty("--dy", (Math.sin(ang) * d).toFixed(1) + "px");
    g.appendChild(s);
  }
  svg.appendChild(g);
  setTimeout(() => g.remove(), 750);
}

/* ---- A2：将军/绝杀全屏霓虹横幅 ---- */
let fxTimer = null;
function flashBanner(txt, kind) {
  const b = document.getElementById("fxbanner");
  if (!b) return;
  b.className = ""; void b.offsetWidth;   // 重启 CSS 动画
  b.innerHTML = `<span>${txt}</span>`;
  b.className = "show " + (kind || "check");
  clearTimeout(fxTimer);
  fxTimer = setTimeout(() => { b.className = ""; b.innerHTML = ""; }, 1600);
}

/* ---- A3：战损陈列区 ---- */
function updateCaptured() {
  const a = document.getElementById("capAI"), h = document.getElementById("capHuman");
  if (!a) return;
  const byAI = [], byHuman = [];
  for (const m of moveList) if (m.cap) (m.byAI ? byAI : byHuman).push(m.cap);
  const fmt = arr => arr.map(p => `<b class="${isRed(p) ? "capR" : "capB"}">${CHAR[p]}</b>`).join("");
  a.innerHTML = fmt(byAI) || "<span class='lbl'>—</span>";
  h.innerHTML = fmt(byHuman) || "<span class='lbl'>—</span>";
}

function render() { drawPieces(); renderMoves(); updateCaptured(); }

function renderMoves() {
  const box = document.getElementById("moves");
  if (!moveList.length) { box.textContent = "—"; return; }
  let html = "";
  for (let i = 0; i < moveList.length; i++) {
    html += `<b>${i % 2 === 0 ? (Math.floor(i/2)+1) + "." : "…"}</b> ${moveList[i].cn} `;
    if (i % 2 === 1) html += "<br>";
  }
  box.innerHTML = html;
  box.scrollTop = box.scrollHeight;
}

function setStatus(txt, cls) {
  const s = document.getElementById("status");
  s.innerHTML = cls ? `<span class="${cls}">${txt}</span>` : txt;
}

function fmtScore(sc) {
  if (!sc) return "—";
  const [k, v] = sc.split(" ");
  if (k === "cp") { const n = (+v) / 100; return (n >= 0 ? "+" : "") + n.toFixed(2); }
  return "绝杀 " + v;
}

/* 把引擎 PV（UCI 串）从当前局面逐着翻译成中文着法，最多 maxN 着 */
function pvToCn(pvStr, maxN) {
  const toks = (pvStr || "").split(/\s+/).filter(t => t.length === 4).slice(0, maxN || 5);
  const b = board.slice();
  const out = [];
  for (const t of toks) {
    const from = idx(FILES.indexOf(t[0]), +t[1]);
    const to = idx(FILES.indexOf(t[2]), +t[3]);
    if (from < 0 || to < 0 || !b[from]) break;
    out.push(moveToCN(b, from, to));
    const nb = applyMove(b, from, to);
    for (let i = 0; i < 90; i++) b[i] = nb[i];
  }
  return out.join("  ");
}

/* 引擎评分串（行棋方视角）→ 白话分差。候选场景下行棋方就是 AI（我方） */
function cnScore(sc) {
  const [k, v] = (sc || "").split(" ");
  if (k === "cp") { const n = (+v) / 100; return (n >= 0 ? "+" : "") + n.toFixed(1) + " 兵"; }
  if (k === "mate") { const n = +v; return n > 0 ? `我方 ${n} 步杀` : `对方 ${-n} 步杀`; }
  return "";
}

/* 白话形势描述：v 为我方（AI 代打的一方）视角兵值（正=我方优）。
   用户靠 AI 替自己和别人下棋，所以永远按 AI 那方的视角说"我方/对方" */
function verdictText(v) {
  const av = Math.abs(v);
  if (av < 0.1) return "局势均衡";
  const who = v > 0 ? "我方" : "对方";
  if (av < 0.6) return who + " 略优";
  if (av < 1.8) return `${who} 多优约 ${av.toFixed(1)} 兵`;
  if (av < 4) return `${who} 大优 ${av.toFixed(1)} 兵`;
  return `${who} 胜势（多 ${av.toFixed(1)} 兵）`;
}

/* sc 为引擎原始分（行棋方视角）；sign=+1 表示行棋方是我方（AI 那方），-1 翻转成我方视角 */
function setScore(sc, depth, sign) {
  const el = document.getElementById("score");
  const fill = document.getElementById("evalfill");
  const note = document.getElementById("evalnote");
  const meta = document.getElementById("meta");
  if (!sc) {
    el.textContent = "—"; el.style.color = "";
    fill.style.width = "50%";
    if (note) note.textContent = "";
    meta.textContent = "深度 —";
    return;
  }
  const [kind, val] = sc.split(" ");
  const s = sign || 1;
  if (kind === "mate") {
    const v = (+val) * s;
    el.textContent = v > 0 ? `我方 ${v} 步内必杀` : `对方 ${-v} 步内必杀`;
    el.style.color = v > 0 ? "#e05a4a" : "#79b8d8";
    fill.style.width = v > 0 ? "97%" : "3%";
    if (note) note.textContent = "绝杀已算出，这盘棋已经没有悬念";
  } else {
    const v = (+val / 100) * s;
    el.textContent = verdictText(v);
    el.style.color = Math.abs(v) < 0.1 ? "" : (v > 0 ? "#e05a4a" : "#79b8d8");
    const pct = 50 + Math.sign(v) * Math.min(Math.abs(v) / 6, 1) * 47;
    fill.style.width = pct.toFixed(1) + "%";
    if (note) note.textContent = `引擎评分：我方视角 ${v >= 0 ? "+" : ""}${v.toFixed(2)} 兵（1 兵≈最低级过河子价值）`;
  }
  meta.textContent = "深度 " + (depth || "—");
}

/* ================= 交互 ================= */
svg.addEventListener("click", ev => {
  if (!board.length || thinking || gameOver) return;
  if (turn !== humanSide) return;
  const rect = svg.getBoundingClientRect();
  const x = ev.clientX - rect.left, y = ev.clientY - rect.top;
  let c = Math.round((x - M) / CELL), r = Math.round((9 - (y - M) / CELL));
  if (c < 0 || c > 8 || r < 0 || r > 9) return;
  if (flipped) { c = 8 - c; r = 9 - r; }   // 屏幕位置 → 实际棋盘坐标
  const i = idx(c, r);
  const target = legal.find(m => m.to === i);
  if (target) { doHumanMove(target.from, target.to); return; }
  const p = board[i];
  if (p && sideOf(p) === humanSide) {
    selected = i;
    legal = legalMovesFrom(board, i, humanSide);
  } else {
    selected = -1; legal = [];
  }
  render();
});

function uciOf(from, to) {
  return FILES[colOf(from)] + rowOf(from) + FILES[colOf(to)] + rowOf(to);
}

function doHumanMove(from, to) {
  // 防线：非法着法（走错方/不合法）绝不发引擎——Pikafish 收到非法着会直接退出
  if (!board[from] || sideOf(board[from]) !== humanSide) return;
  if (!legalMovesFrom(board, from, humanSide).some(m => m.to === to)) return;
  const cn = moveToCN(board, from, to);
  const cap = !!board[to];
  const capP = board[to];
  board = applyMove(board, from, to);
  const gaveCheck = kingAttacked(board, other(humanSide));
  moveList.push({ from, to, uci: uciOf(from, to), cn, byAI:false, gaveCheck, cap: capP });
  selected = -1; legal = [];
  turn = other(turn);
  recordPosition();
  pendingAnim = { from, to, capP };
  render();
  playMoveSound(false, cap);
  document.getElementById("lasthint").textContent = `你走了 ${cn}`;
  if (checkGameEnd()) return;
  if (gaveCheck) flashBanner("将军！", "check");
  setStatus(`你走了 ${cn}，AI 思考中…`);
  aiMove();
}

function checkGameEnd() {
  const moves = allLegalMoves(board, turn);
  const inCheck = kingAttacked(board, turn);
  if (moves.length === 0) {
    gameOver = true;
    const winner = other(turn);
    setStatus(`对局结束：${winner === RED ? "红方" : "黑方"}胜（${inCheck ? "将死" : "困毙"}）`);
    flashBanner(inCheck ? "绝杀" : "困毙", "mate");
    return true;
  }
  // 三次重复局面：长将方负；双方循环将军或无人长打则和
  const k = posKey(board, turn);
  if ((posHistory[k] || 0) >= 3) {
    const rStreak = checkStreakOf(RED), bStreak = checkStreakOf(BLK);
    gameOver = true;
    if (rStreak >= 2 && bStreak >= 2) setStatus("对局结束：双方循环将军（长打），判和棋");
    else if (rStreak >= 2) setStatus("对局结束：红方长将违规，黑方胜");
    else if (bStreak >= 2) setStatus("对局结束：黑方长将违规，红方胜");
    else setStatus("对局结束：三次重复局面，和棋");
    return true;
  }
  if (inCheck) {
    playCheckSound();
    setStatus(turn === humanSide ? "你被将军了！" : "将军！", "em");
  } else {
    setStatus(turn === humanSide ? "轮到你走棋" : "AI 思考中…");
  }
  return false;
}

function applyAIMove(from, to, suffix) {
  const cn = moveToCN(board, from, to);
  const cap = !!board[to];
  const capP = board[to];
  board = applyMove(board, from, to);
  const gaveCheck = kingAttacked(board, humanSide);
  moveList.push({ from, to, uci: uciOf(from, to), cn, byAI:true, gaveCheck, cap: capP });
  turn = other(turn);
  recordPosition();
  document.getElementById("lasthint").textContent = `AI 走了 ${cn}${suffix || ""}`;
  pendingAnim = { from, to, capP };
  render();
  playMoveSound(true, cap);
  if (checkGameEnd()) return;
  if (gaveCheck) flashBanner("将军！", "check");
  setStatus(`AI 走了 <b>${cn}</b>${suffix || ""} · 轮到你走棋`);
}

/* ---------- 候选着法：渲染 + 点击改走 ---------- */
function renderCandidates(cands, played, bookMode) {
  const pvsEl = document.getElementById("pvs");
  if (bookMode) {
    const tot = cands.reduce((s, c) => s + (c.wvl || 0), 0) || 1;
    pvsEl.innerHTML = `<b>开局库前 3 候选</b>（职业实战出现频率 · 点击候选可改走该手）<br>` +
      cands.map(c => `<div class="cand${c.uci === played ? " picked" : ""}" data-uci="${c.uci}">` +
        `${c.uci === played ? "✅" : "　"} ${pvToCn(c.uci, 1) || c.uci}（约 ${Math.round(c.wvl / tot * 100)}%）</div>`).join("");
  } else {
    pvsEl.innerHTML = `<b>AI 候选着法</b>（我方视角 · 点击候选可改走该手）<br>` +
      cands.map((c, i) => `<div class="cand${c.uci === played ? " picked" : ""}" data-uci="${c.uci}">` +
        `<b>#${i + 1}</b> ${c.uci === played ? "✅" : "　"} ${pvToCn(c.uci, 1) || c.uci} ${cnScore(c.score)}` +
        (c.pv ? `<br><span class="small">　　续着: ${pvToCn(c.pv, 5)}</span>` : "") + `</div>`).join("");
  }
  pvsEl.querySelectorAll(".cand").forEach(el => {
    el.onclick = () => pickCandidate(el.dataset.uci);
  });
}

/* 点击候选 → 撤掉 AI 刚走的那手，改走所选候选（仅当 AI 一手是最新着时有效） */
function pickCandidate(uci) {
  if (!lastAI || thinking) return;
  if (moveList.length !== lastAI.ply || !moveList.length ||
      !moveList[moveList.length - 1].byAI) return;
  if (uci === lastAI.played) return;
  const c = lastAI.cands.find(x => x.uci === uci);
  if (!c) return;
  const kk = posKey(board, turn);            // 回滚三次重复计数（与悔棋同一套逻辑）
  if (posHistory[kk] > 0) posHistory[kk]--;
  const m = moveList.pop();
  board[m.from] = board[m.to];
  board[m.to] = m.cap || null;
  turn = other(turn);
  gameOver = false;
  const from = idx(FILES.indexOf(uci[0]), +uci[1]);
  const to = idx(FILES.indexOf(uci[2]), +uci[3]);
  const cnCand = pvToCn(uci, 1) || uci;      // 趁棋盘还是走前局面翻译中文
  // 长将防护（与 AI 自动走棋同一道检查）：这手若构成长将违规，AI 会当场判负，禁止改走
  if (wouldBeLongCheck(from, to)) {
    const piece = board[m.from];             // 还原 AI 原着法
    board[m.to] = piece;
    board[m.from] = m.cap || null;
    turn = other(turn);
    recordPosition();
    render();
    setStatus(`「${cnCand}」会构成长将违规，已保持原着法`);
    return;
  }
  lastAI.played = uci;
  // 先重渲染候选（棋盘仍是 AI 走前局面，中文翻译才正确），再落新着
  renderCandidates(lastAI.cands, uci, lastAI.book);
  applyAIMove(from, to, "（你选的候选着法）");
  if (c.score) setScore(c.score, c.depth || 0, 1);   // 开局库候选无分数，保留原评估
  lastAI.ply = moveList.length;
}

async function aiMove() {
  thinking = true;
  lastAI = null;
  document.getElementById("newgame").disabled = true;
  const level = +document.getElementById("level").value;
  const moves = moveList.map(m => m.uci);
  // 招牌首着直接落下：它是这个开局的定义，不能交给引擎按分挑选
  // （飞相、过宫炮、上仕这类防守着法进不了引擎前几名，交给引擎就永远走不出来）
  const sig = themeSignature();
  if (sig) {
    setStatus(`AI 按「${sig.name}」走出招牌首着…`);
    await new Promise(r => setTimeout(r, 300));
    thinking = false;
    document.getElementById("newgame").disabled = false;
    setScore("", 0);
    document.getElementById("pvs").textContent = `开局套路：${sig.name} 的招牌首着`;
    applyAIMove(sig.from, sig.to, `（套路首着：${sig.name}）`);
    return;
  }
  const th = themeCandidates();
  // 长将主动变招：AI 已连续将军 2 步时，本手强制只在"不给将军"的闲着里选最优，
  // 让引擎换思路，而不是等违规边缘再把单手着法堵掉
  const aiSide = other(humanSide);
  const aiStreak = checkStreakOf(aiSide);
  let quietUcis = null;
  if (aiStreak >= 2) {
    const all = allLegalMoves(board, aiSide);
    const quiet = all.filter(m => !kingAttacked(applyMove(board, m.from, m.to), humanSide));
    if (quiet.length && quiet.length < all.length) {
      quietUcis = quiet.map(m => uciOf(m.from, m.to));
      setStatus(`AI 已连续将军 ${aiStreak} 步，主动变招换思路…`);
    }
  }
  setStatus(quietUcis ? `AI 已连续将军，主动变招换思路…`
            : th ? `AI 按「${th.name}」思考中…` : "AI 思考中…");
  let res = null, usedTheme = false;
  try {
    if (quietUcis) {
      // 排除所有将军着：引擎只能在闲着里选最优，等于强制换思路（实测 Pikafish
      // 忽略 searchmoves，所以用排除法而不是限定搜索集合）
      const checks = allLegalMoves(board, aiSide)
        .filter(m => kingAttacked(applyMove(board, m.from, m.to), humanSide))
        .map(m => uciOf(m.from, m.to));
      const r = await fetch("/ai_exclude", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ moves, level, exclude: checks })
      }).then(r => r.json());
      if (r.ok && r.best && r.best !== "(none)") res = r;
    } else if (th) {
      const r = await fetch("/ai_theme", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ moves, level, allow: th.allow })
      }).then(r => r.json());
      if (r.ok && r.best) { res = r; usedTheme = true; }
      else if (r.ok) setStatus(`「${th.name}」当前着法均不利，AI 自由发挥…`);
    }
    if (!res) {
      res = await fetch("/ai", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ moves, level })
      }).then(r => r.json());
      if (!res.ok) throw new Error(res.error || "引擎错误");
    }
    if (res.best === "(none)" || !res.best) {
      gameOver = true;
      setStatus("对局结束：AI 无棋可走，你获胜");
      thinking = false; document.getElementById("newgame").disabled = false;
      return;
    }
    let from = idx(FILES.indexOf(res.best[0]), +res.best[1]);
    let to = idx(FILES.indexOf(res.best[2]), +res.best[3]);
    // 长将预防：若这步会构成长将违规（局面第3次重复且AI连续在将），排除它重新选
    if (wouldBeLongCheck(from, to)) {
      setStatus("该手将构成长将违规，AI 变着…");
      const banned = [res.best];
      for (let retry = 0; retry < 3; retry++) {
        const r2 = await fetch("/ai_exclude", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ moves, level, exclude: banned })
        }).then(r => r.json());
        if (!r2.ok || !r2.best || r2.best === "(none)") break;
        const f2 = idx(FILES.indexOf(r2.best[0]), +r2.best[1]);
        const t2 = idx(FILES.indexOf(r2.best[2]), +r2.best[3]);
        if (!wouldBeLongCheck(f2, t2)) {
          from = f2; to = t2; res = r2; usedTheme = false;
          break;
        }
        banned.push(r2.best);
      }
    }
    setScore(res.score, res.depth, 1);   // AI 是行棋方，引擎分已是我方视角
    const cands = res.candidates || [];
    if (cands.length) {
      renderCandidates(cands, res.best, !!res.book);
    } else {
      document.getElementById("pvs").textContent = res.book
        ? (usedTheme ? `套路「${th.name}」∩ 职业开局库（按比赛统计权重挑选）`
                     : "职业开局库：主流着法（按比赛统计权重挑选，零延迟）")
        : usedTheme
          ? `套路内最优：${th.name}（比较了 ${res.tried} 个合套路的着法）`
          : "主变: " + (pvToCn(res.pv, 6) || res.best);
    }
    thinking = false;
    document.getElementById("newgame").disabled = false;
    const tag = res.book ? "开局库" : `评分 ${fmtScore(res.score)}`;
    applyAIMove(from, to, usedTheme ? `（套路：${th.name} · ${tag}）` : `（${tag}）`);
    lastAI = { ply: moveList.length, played: res.best, cands, book: !!res.book };
  } catch (e) {
    thinking = false;
    document.getElementById("newgame").disabled = false;
    setStatus("引擎调用失败：" + e.message, "em");
  }
}

async function analyzeNow() {
  if (thinking || !board.length) return;
  setStatus("引擎分析中…");
  const sign = turn === other(humanSide) ? 1 : -1;   // 行棋方视角 → 我方（AI 方）视角
  try {
    const res = await fetch("/analyze", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ moves: moveList.map(m => m.uci), movetime: 2500 })
    }).then(r => r.json());
    if (!res.ok) throw new Error(res.error || "分析失败");
    setScore(res.score, res.depth, sign);
    const lines = (res.lines || []).map((l, i) => {
      const [kind, val] = (l.score || "cp 0").split(" ");
      const v = kind === "mate" ? (+val) * sign : (+val / 100) * sign;
      const s = kind === "mate"
        ? (v > 0 ? `我方 ${v} 步杀` : `对方 ${-v} 步杀`)
        : `${v >= 0 ? "+" : ""}${v.toFixed(1)} 兵`;
      const cn = pvToCn(l.pv, 5);
      return `<b>#${i + 1}</b>&nbsp; ${s}&nbsp; ${cn || l.pv || "—"}`;
    });
    document.getElementById("pvs").innerHTML =
      (lines.length ? `<b>当前局面候选</b>（我方视角，按推荐排序）<br>` : "") +
      lines.join("<br>") || "无结果";
    setStatus(turn === humanSide ? "轮到你走棋" : "AI 思考中…");
  } catch (e) {
    setStatus("分析失败：" + e.message, "em");
  }
}

/* ================= 按钮 ================= */
document.getElementById("newgame").onclick = () => {
  humanSide = document.getElementById("side").value === "red" ? RED : BLK;
  flipped = (humanSide === BLK);   // 执黑 → 黑方在下半盘
  resetBoard();
  selected = -1; legal = []; thinking = false; gameOver = false; lastAI = null;
  drawBoardBase();
  render();
  setScore("", 0);
  document.getElementById("pvs").textContent = "尚无分析";
  document.getElementById("lasthint").textContent = "—";
  if (humanSide === RED) {
    setStatus("你执红先行，请走棋");
  } else {
    setStatus("你执黑，AI 先行…");
    aiMove();
  }
};

document.getElementById("undo").onclick = () => {
  if (thinking || gameOver || moveList.length === 0) return;
  const plies = turn === humanSide ? 2 : 1;
  for (let k = 0; k < plies && moveList.length; k++) {
    const kk = posKey(board, turn);          // 当前局面就是最后一手走完记录的那个
    if (posHistory[kk] > 0) posHistory[kk]--; // 回滚三次重复计数
    const m = moveList.pop();
    board[m.from] = board[m.to];
    board[m.to] = m.cap || null;              // 恢复被吃棋子
    turn = other(turn);
  }
  selected = -1; legal = []; lastAI = null;
  render();
  setStatus("已悔棋，轮到你走棋");
};

document.getElementById("analyze").onclick = analyzeNow;

/* ================= 启动 ================= */
document.addEventListener("pointerdown", () => audio(), { once: true });
drawBoardBase();
resetBoard();
render();
(function initTheme() {
  let saved = "cyber";
  try { saved = localStorage.getItem("xq_theme") || "cyber"; } catch (e) {}
  const q = new URLSearchParams(location.search).get("theme"); // ?theme=xxx 可直接指定主题（分享链接用）
  if (q && THEMES[q]) saved = q;
  const sel = document.getElementById("theme");
  sel.value = THEMES[saved] ? saved : "cyber";
  applyTheme(sel.value);
  sel.onchange = () => applyTheme(sel.value);
})();
fetch("/health").then(r => r.json()).then(h => {
  if (h.ok) document.querySelector(".title").innerHTML =
    `<b>中国象棋</b> · ${h.engine} · 本地离线 · ${h.threads}线程/${h.hash}MB哈希`;
}).catch(() => {});
// PWA：注册 service worker（localhost 属 secure context，可离线缓存静态资源）
if ("serviceWorker" in navigator)
  navigator.serviceWorker.register("/sw.js").catch(() => {});
</script>
