name: 功能建议
description: 提出一个新功能或改进想法
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        这个项目刻意保持「本地离线、零依赖、单文件前端」。提出建议时请说明它是否与这个约束冲突——
        需要联网、需要引入第三方库、或需要构建步骤的方案，通常不会被采纳。

  - type: dropdown
    id: area
    attributes:
      label: 涉及范围
      options:
        - 对弈与引擎（难度、思考控制、候选着法）
        - 棋谱与回看
        - 手动摆谱
        - 界面与主题
        - 规则判定
        - 移动端 / PWA
        - 文档与打包
        - 其他
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题
      description: 描述使用场景，而不是直接给方案
      placeholder: 摆谱时想一次放多个同类型棋子，现在每次都要重新点工具栏
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的做法
      description: 你设想的交互或实现方式，越具体越好
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 可选

  - type: checkboxes
    id: constraints
    attributes:
      label: 约束自查
      options:
        - label: 方案不需要联网
        - label: 方案不需要引入第三方前端库或 CDN
        - label: 方案不需要新增构建步骤
